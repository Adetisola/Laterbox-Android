name: Laterbox Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.0.62)'
        required: true
        default: 'v1.0.62'
      delta_rolling_window:
        description: 'Number of previous stable releases for rolling-window delta patches'
        required: false
        default: '5'
      distribution_repo:
        description: 'Optional distribution repository override (defaults to vars.DISTRIBUTION_REPO or Adetisola/Laterbox)'
        required: false
        default: ''
      dry_run:
        description: 'Build, verify APKs/deltas, and validate notes without publishing to the distribution repository'
        required: false
        type: boolean
        default: false
      release_notes_override:
        description: 'Optional sanitized public release notes (if release-notes/vX.Y.Z.md is not yet committed)'
        required: false
        default: ''

env:
  DELTA_ROLLING_WINDOW: 5
  DEFAULT_DISTRIBUTION_REPO: Adetisola/Laterbox

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Verify & Publish to Distribution Repo
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Private Android Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Distribution Target & Release Tag
        id: resolve_target
        run: |
          RAW_TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          CLEAN_VERSION="${RAW_TAG#v}"
          if [ -z "$CLEAN_VERSION" ] || [ "$CLEAN_VERSION" = "main" ]; then
            echo "::error::Invalid release tag '$RAW_TAG'. Provide a v* tag or workflow_dispatch version_tag."
            exit 1
          fi
          DIST_REPO="${{ github.event.inputs.distribution_repo || vars.DISTRIBUTION_REPO || env.DEFAULT_DISTRIBUTION_REPO }}"
          DIST_OWNER="${DIST_REPO%%/*}"
          DIST_NAME="${DIST_REPO##*/}"
          if [ "$DIST_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "::warning::Distribution repo '$DIST_REPO' matches source repo '$GITHUB_REPOSITORY'. Separate Adetisola/Laterbox-Android and Adetisola/Laterbox after cutover."
          fi
          echo "tag_name=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "distribution_repo=$DIST_REPO" >> "$GITHUB_OUTPUT"
          echo "distribution_owner=$DIST_OWNER" >> "$GITHUB_OUTPUT"
          echo "distribution_name=$DIST_NAME" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ github.event.inputs.dry_run == true }}" >> "$GITHUB_OUTPUT"

      - name: Prepare & Validate Sanitized Public Release Notes
        id: validate_notes
        env:
          NOTES_OVERRIDE: ${{ github.event.inputs.release_notes_override }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TAG="${{ steps.resolve_target.outputs.tag_name }}"
          NOTES_PATH="/tmp/sanitized_release_notes.md"
          if [ -n "$NOTES_OVERRIDE" ]; then
            printf '%s\n' "$NOTES_OVERRIDE" > "$NOTES_PATH"
          elif [ -f "release-notes/${TAG}.md" ]; then
            cp "release-notes/${TAG}.md" "$NOTES_PATH"
          else
            echo "No release-notes/${TAG}.md found; auto-generating sanitized user-facing release notes..."
            PYTHONPATH=. python3 tools/release/generate_release_notes.py --repo-dir . --tag "$TAG" --output "$NOTES_PATH"
          fi
          PYTHONPATH=. python3 tools/release/validate_release_notes.py --file "$NOTES_PATH"
          echo "notes_file=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate Cross-Repo Distribution Credentials
        if: steps.resolve_target.outputs.dry_run != 'true'
        env:
          HAS_APP_ID: ${{ secrets.DISTRIBUTION_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_ID" != "true" ] || [ "$HAS_APP_KEY" != "true" ]; then
            echo "::error::Missing DISTRIBUTION_APP_ID or DISTRIBUTION_APP_PRIVATE_KEY secret for cross-repository publishing to ${{ steps.resolve_target.outputs.distribution_repo }}."
            echo "::error::Create a GitHub App with Contents (Read & Write) permission installed only on ${{ steps.resolve_target.outputs.distribution_repo }}, and store its App ID and Private Key in this repository's Actions secrets."
            exit 1
          fi

      - name: Mint Scoped Distribution GitHub App Token
        id: dist_token
        if: steps.resolve_target.outputs.dry_run != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: ${{ steps.resolve_target.outputs.distribution_owner }}
          repositories: ${{ steps.resolve_target.outputs.distribution_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Robolectric SDKs
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository/org/robolectric
            ~/.cache/robolectric
          key: robolectric-${{ runner.os }}-sdk34-v2
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --info --stacktrace

      - name: Run Release Tooling Unit Tests
        run: |
          pip3 install --break-system-packages bsdiff4 || pip3 install bsdiff4
          python3 -m unittest discover -s tools/release -p "test_*.py" -v
          python3 -m unittest discover -s tools/distribution -p "test_*.py" -v
          python3 -m unittest discover -s tools/delta -p "test_*.py" -v

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Setup Signing Keystore & Version Metadata
        id: setup_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Refusing to fall back to debug signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          echo "KEYSTORE_PATH=/tmp/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          COMPUTED_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$COMPUTED_VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${{ steps.resolve_target.outputs.version_name }}" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> "$GITHUB_ENV"
          fi
          echo "Configured release build: versionName=${{ steps.resolve_target.outputs.version_name }}, versionCode=$COMPUTED_VERSION_CODE"

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Cleanup Temporary Keystore
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Locate, Verify & Package Release APKs
        id: locate_apks
        run: |
          mkdir -p release_artifacts
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          EXPECTED_SHA256="67388d12f96d7b15179ef02354842faabfaff944a49c466ad3f539d2a2063e32"

          ARM32_SRC=$(find app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" | head -n 1)
          ARM64_SRC=$(find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" | head -n 1)
          UNIVERSAL_SRC=$(find app/build/outputs/apk/release/ -name "*universal*.apk" | head -n 1)
          if [ -z "$UNIVERSAL_SRC" ]; then
            UNIVERSAL_SRC="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ ! -f "$ARM32_SRC" ] || [ ! -f "$ARM64_SRC" ] || [ ! -f "$UNIVERSAL_SRC" ]; then
            echo "::error::Could not find all 3 required release APKs in app/build/outputs/apk/release/!"
            ls -la app/build/outputs/apk/release/
            exit 1
          fi

          cp "$ARM32_SRC" release_artifacts/Laterbox-ARM32.apk
          cp "$ARM64_SRC" release_artifacts/Laterbox-ARM64.apk
          cp "$UNIVERSAL_SRC" release_artifacts/Laterbox-Universal.apk

          echo "=== Verifying APKs ==="
          for TARGET in release_artifacts/Laterbox-ARM32.apk release_artifacts/Laterbox-ARM64.apk release_artifacts/Laterbox-Universal.apk; do
            echo "--- Verifying $TARGET ---"
            BADGING=$("$AAPT2" dump badging "$TARGET")
            PKG_LINE=$(echo "$BADGING" | grep "^package:")
            echo "$PKG_LINE"

            APK_PKG=$(echo "$PKG_LINE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            APK_VCODE=$(echo "$PKG_LINE" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")
            APK_VNAME=$(echo "$PKG_LINE" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")

            if [ "$APK_PKG" != "com.laterbox.app" ]; then
              echo "::error::Unexpected applicationId in $TARGET: $APK_PKG"
              exit 1
            fi
            if [ "$APK_VCODE" != "$VERSION_CODE" ] || [ "$APK_VCODE" -le 1 ]; then
              echo "::error::Invalid versionCode in $TARGET: $APK_VCODE (expected $VERSION_CODE)"
              exit 1
            fi
            if [ "$APK_VNAME" != "$VERSION_NAME" ]; then
              echo "::error::Unexpected versionName in $TARGET: $APK_VNAME (expected $VERSION_NAME)"
              exit 1
            fi

            CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$TARGET")
            if echo "$CERT_OUT" | grep -qi "Android Debug"; then
              echo "::error::$TARGET is signed with an Android Debug certificate!"
              exit 1
            fi
            ACTUAL_SHA256=$(echo "$CERT_OUT" | grep -i "certificate SHA-256 digest:" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]' | tr -d ':')
            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::Certificate SHA-256 mismatch in $TARGET! Got $ACTUAL_SHA256, expected $EXPECTED_SHA256"
              exit 1
            fi
            ls -lh "$TARGET"
          done

          echo "=== Verifying Architecture Contents ==="
          if ! unzip -l release_artifacts/Laterbox-ARM32.apk | grep -q "lib/armeabi-v7a/libpython.zip.so"; then
            echo "::error::Laterbox-ARM32.apk missing lib/armeabi-v7a/libpython.zip.so!"
            exit 1
          fi
          if unzip -l release_artifacts/Laterbox-ARM32.apk | grep -q "lib/arm64-v8a/"; then
            echo "::error::Laterbox-ARM32.apk unexpectedly contains arm64-v8a native libraries!"
            exit 1
          fi

          if ! unzip -l release_artifacts/Laterbox-ARM64.apk | grep -q "lib/arm64-v8a/libpython.zip.so"; then
            echo "::error::Laterbox-ARM64.apk missing lib/arm64-v8a/libpython.zip.so!"
            exit 1
          fi
          if unzip -l release_artifacts/Laterbox-ARM64.apk | grep -q "lib/armeabi-v7a/"; then
            echo "::error::Laterbox-ARM64.apk unexpectedly contains armeabi-v7a native libraries!"
            exit 1
          fi

          if ! unzip -l release_artifacts/Laterbox-Universal.apk | grep -q "lib/armeabi-v7a/libpython.zip.so" || \
             ! unzip -l release_artifacts/Laterbox-Universal.apk | grep -q "lib/arm64-v8a/libpython.zip.so"; then
            echo "::error::Laterbox-Universal.apk missing required dual-architecture native libraries!"
            exit 1
          fi

          echo "All 3 APKs verified successfully!"

      - name: Generate & Verify Delta Patches from Distribution Repo
        id: generate_deltas
        env:
          GH_TOKEN: ${{ steps.dist_token.outputs.token || github.token }}
          DISTRIBUTION_REPO: ${{ steps.resolve_target.outputs.distribution_repo }}
        run: |
          ./gradlew --stop || true
          pip3 install --break-system-packages bsdiff4 || pip3 install bsdiff4

          mkdir -p /tmp/prev_releases
          CURRENT_TAG="${{ steps.resolve_target.outputs.tag_name }}"
          WINDOW_RAW="${{ github.event.inputs.delta_rolling_window || env.DELTA_ROLLING_WINDOW || '5' }}"
          if ! [[ "$WINDOW_RAW" =~ ^[0-9]+$ ]]; then
            echo "Warning: Invalid rolling window '$WINDOW_RAW'; defaulting to 5."
            WINDOW_RAW="5"
          fi
          echo "Discovering rolling-window base releases from $DISTRIBUTION_REPO (window=$WINDOW_RAW)..."

          gh api --paginate --slurp "repos/${DISTRIBUTION_REPO}/releases?per_page=100" > /tmp/releases.json || \
            gh api "repos/${DISTRIBUTION_REPO}/releases?per_page=100" > /tmp/releases.json || \
            echo "[]" > /tmp/releases.json

          SELECTED_JSON=$(python3 tools/delta/generate_delta.py \
            --select-bases \
            --releases-json /tmp/releases.json \
            --current-tag "$CURRENT_TAG" \
            --target-version "${{ env.VERSION_NAME }}" \
            --window "$WINDOW_RAW")

          echo "Selected rolling base releases: $SELECTED_JSON"

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1 || true)
          BASE_ARGS=()

          while IFS=$'\t' read -r BASE_TAG BASE_VER; do
            [ -n "$BASE_TAG" ] || continue
            BASE_DIR="/tmp/prev_releases/${BASE_TAG}"
            mkdir -p "$BASE_DIR"
            echo "Downloading base release APKs for $BASE_TAG from $DISTRIBUTION_REPO..."
            gh release download "$BASE_TAG" -R "$DISTRIBUTION_REPO" --dir "$BASE_DIR" --pattern "Laterbox-*.apk" || true

            BASE_VCODE=0
            SAMPLE_APK=$(find "$BASE_DIR" -maxdepth 1 -name "Laterbox-*.apk" -type f | head -n 1 || true)
            if [ -n "$SAMPLE_APK" ] && [ -n "$AAPT2" ]; then
              BASE_VCODE=$("$AAPT2" dump badging "$SAMPLE_APK" 2>/dev/null | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p" | head -n 1 || true)
              BASE_VCODE="${BASE_VCODE:-0}"
            fi
            BASE_ARGS+=(--base-release "${BASE_VER}:${BASE_VCODE}=${BASE_DIR}")
          done < <(python3 - "$SELECTED_JSON" <<'PY'
          import json, sys
          for item in json.loads(sys.argv[1]):
              print(item["tag_name"] + "\t" + item["version"])
          PY
          )

          python3 tools/delta/generate_delta.py \
            "${BASE_ARGS[@]}" \
            --target-dir release_artifacts \
            --output-dir release_artifacts \
            --target-version "${{ env.VERSION_NAME }}" \
            --target-version-code "${{ env.VERSION_CODE }}" \
            --verify-zip \
            --threshold-ratio 0.70

      - name: Verify Artifacts, Checksums & Publish to Distribution Repo
        env:
          GH_TOKEN: ${{ steps.dist_token.outputs.token || github.token }}
        run: |
          DRY_FLAG=""
          if [ "${{ steps.resolve_target.outputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python3 tools/release/publish_distribution_release.py \
            --distribution-repo "${{ steps.resolve_target.outputs.distribution_repo }}" \
            --tag "${{ steps.resolve_target.outputs.tag_name }}" \
            --title "Laterbox ${{ steps.resolve_target.outputs.tag_name }}" \
            --notes-file "${{ steps.validate_notes.outputs.notes_file }}" \
            --artifacts-dir release_artifacts \
            --version-name "${{ env.VERSION_NAME }}" \
            --version-code "${{ env.VERSION_CODE }}" \
            $DRY_FLAG

      - name: Upload Build Artifacts (Private CI Retention)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: laterbox-release-artifacts
          path: |
            release_artifacts/*.apk
            release_artifacts/*.patch
            release_artifacts/delta-manifest.json
            release_artifacts/release-manifest.json
            release_artifacts/checksums.sha256
          retention-days: 3

      - name: Invalidate Backend Release Cache (Optional)
        if: steps.resolve_target.outputs.dry_run != 'true' && vars.UPDATE_CACHE_INVALIDATE_URL != ''
        env:
          INVALIDATE_URL: ${{ vars.UPDATE_CACHE_INVALIDATE_URL }}
          ADMIN_TOKEN: ${{ secrets.UPDATE_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Skipping backend cache invalidation: UPDATE_ADMIN_TOKEN secret is not set."
            exit 0
          fi
          curl -fsS -X POST "$INVALIDATE_URL" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"source":"release-workflow"}' || echo "::warning::Backend cache invalidation request failed; webhook or TTL will still refresh."
